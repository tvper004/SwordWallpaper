[package]
name = "aura"
version = "1.6.0"
edition = "2021"
description = "Gestor nativo de fondos de pantalla animados y videos de pantalla de inicio (Lock Screen) para macOS"
authors = ["tvper004"]
license = "MIT"
repository = "https://github.com/tvper004/SwordWallpaper"
homepage = "https://github.com/tvper004/SwordWallpaper"
readme = "README.md"
keywords = ["wallpaper", "live-wallpaper", "macos", "lockscreen", "aerial"]
categories = ["gui", "multimedia", "desktop-environment"]

[[bin]]
name = "aura"
path = "src/main.rs"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = ["wgpu", "tokio", "single-instance"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
open = "5.3"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
ksni = "0.3.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
