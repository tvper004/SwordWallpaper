name: macOS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-macos:
    name: Build & Package Sword Wallpaper (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Unit Tests
        run: cargo test

      - name: Package & Sign macOS App Bundle
        run: ./scripts/package-macos.sh

      - name: Create Release Archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent "target/Sword Wallpaper.app" "target/Sword-Wallpaper-${{ github.ref_name }}-macOS.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Sword Wallpaper ${{ github.ref_name }} (macOS)"
          generate_release_notes: true
          files: |
            target/Sword-Wallpaper-${{ github.ref_name }}-macOS.zip
